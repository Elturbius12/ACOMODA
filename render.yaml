# Render Blueprint: crea la app web y su base de datos Postgres gratuita de una vez.
# En Render: New → Blueprint → elija el repositorio. Render lee este archivo.
services:
  - type: web
    name: acomoda
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # aquí se guarda el progreso de cada proyecto
        fromDatabase:
          name: acomoda-db
          property: connectionString
      - key: ACOMODA_DIAS_CONSERVAR
        value: "25"                # la base gratuita es de 1 GB: se borran proyectos sin abrir en 25 días

databases:
  - name: acomoda-db
    plan: free
    databaseName: acomoda
    user: acomoda
    ipAllowList: []                # solo la app (red interna de Render) puede conectarse
